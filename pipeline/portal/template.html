<title>David Health Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + scoped toolbar; every analytic view re-renders against one date range. Light-only by choice. */
:root {
  color-scheme: light;
  --page: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --ink: #0e1116;
  --ink-2: #4a5160;
  --muted: #8a909c;
  --hair: #e6e8ec;
  --grid: #eef0f3;
  --ring: rgba(14, 17, 22, 0.08);
  --accent: #4b4fd8;
  --accent-wash: #eef0ff;
  /* glucose ranges (validated adjacent, light surface) */
  --g-vlow: #b02a35; --g-low: #ec6a6e; --g-in: #2a78d6; --g-high: #e3a008; --g-vhigh: #b4541a;
  --g-in-wash: rgba(42, 120, 214, 0.08);
  /* status */
  --s-good: #1f9d5a; --s-target: #2a78d6; --s-warn: #e3a008; --s-crit: #d63c3c;
  --s-good-ink: #0f6b3a; --s-warn-ink: #8a5d00; --s-crit-ink: #a52222; --s-target-ink: #1c5cab;
  /* categorical */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-card: 12px;
  --shadow: 0 1px 2px rgba(14, 17, 22, 0.04), 0 0 0 1px var(--ring);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 20px 14px; border-right: 1px solid var(--hair); background: var(--surface-2); display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; text-align: left; }
.nav button svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav button:hover { background: rgba(14, 17, 22, 0.04); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.rail-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.rail-foot .fresh { display: flex; align-items: center; gap: 6px; }

.main { min-width: 0; padding-inline: 32px; padding-block: 22px 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; background: #eceef2; border-radius: 9px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14,17,22,.08), 0 0 0 1px var(--ring); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }
.range-label { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 5px 10px; border: 1px solid var(--hair); border-radius: 8px; background: var(--surface); }

/* period banner + "what does this number cover" captions */
.period { display: grid; gap: 4px; margin: -8px 0 18px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.period b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.per-k { display: inline-block; min-width: 104px; font: 500 11px/1 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.kpi-head { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px 2px; font-variant-numeric: tabular-nums; }
.kpi-head b { color: var(--ink); font-weight: 600; }
.when { display: block; font-size: 11.5px; color: var(--muted); }
.when-line { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when-chip { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hair); font: 500 11px var(--font-mono); color: var(--ink-2); white-space: nowrap; }
@media (max-width: 820px) { .per-k { display: block; min-width: 0; margin-bottom: 2px; } }

.grid { display: grid; gap: 16px; }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.stack { display: grid; gap: 16px; }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.card-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.card-h .aside { display: flex; align-items: center; gap: 8px; flex: none; }
.scope { font: 500 11px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--hair); border-radius: 5px; }
.ask { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--accent); text-decoration: none; padding: 4px 8px; border-radius: 7px; }
.ask:hover { background: var(--accent-wash); }
.ask svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 1px; background: var(--hair); border-radius: var(--r-card); overflow: hidden; box-shadow: 0 0 0 1px var(--hair); margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; display: grid; gap: 4px; }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.kpi .val { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.delta { font-weight: 500; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--s-good-ink); }
.delta.bad { color: var(--s-crit-ink); }
.delta.flat { color: var(--muted); }

/* status chips: icon + label, never color alone */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 7px 2px 6px; border-radius: 999px; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.good { background: #e7f5ed; color: var(--s-good-ink); } .chip.good i { background: var(--s-good); }
.chip.target { background: #e8f1fc; color: var(--s-target-ink); } .chip.target i { background: var(--s-target); }
.chip.warn { background: #fdf4dc; color: var(--s-warn-ink); } .chip.warn i { background: var(--s-warn); }
.chip.crit { background: #fbe9e9; color: var(--s-crit-ink); } .chip.crit i { background: var(--s-crit); }
.chip.none { background: #f0f1f4; color: var(--ink-2); } .chip.none i { background: var(--muted); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl-t { fill: var(--muted); font: 11px var(--font-mono); font-variant-numeric: tabular-nums; }
.lbl-ink { fill: var(--ink-2); font: 500 11.5px var(--font-ui); }
.lbl-strong { fill: var(--ink); font: 600 12px var(--font-ui); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: #d4d7dd; stroke-width: 1; }
.refline { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.cross { stroke: var(--ink-2); stroke-width: 1; opacity: .5; pointer-events: none; }
.hit { fill: transparent; cursor: crosshair; }
.mark { transition: opacity .12s; }
.mark:hover, .mark.hl { opacity: .78; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 24px rgba(14,17,22,.18); min-width: 120px; max-width: 260px; }
.tip .t-h { color: #b9bfcc; font: 11px var(--font-mono); margin-bottom: 4px; }
.tip .t-r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .t-r b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .t-r span { color: #c7ccd6; display: inline-flex; align-items: center; gap: 6px; }
.tip .k { width: 10px; height: 2px; border-radius: 2px; display: inline-block; }

/* range mix bar */
.mix { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.mix div { height: 100%; }
.mix-rows { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.mix-rows div { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
.mix-rows b { font-size: 16px; color: var(--ink); font-weight: 600; }
.mix-rows .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.mix-rows em { font-style: normal; color: var(--muted); font-size: 11.5px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }

/* today */
.hero-num { font-size: 52px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.hero-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.metric-list { display: grid; gap: 10px; margin-top: 14px; }
.metric-list div { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: 13px; }
.metric-list span { color: var(--ink-2); }
.metric-list b { font-weight: 600; font-variant-numeric: tabular-nums; }
.metric-list em { font-style: normal; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 14px; }
.dots span { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 600 9px var(--font-mono); }
.dots .w { background: #e7f5ed; color: var(--s-good-ink); }
.dots .m { background: #f0f1f4; color: var(--muted); }
.dots .p { background: #fff; color: var(--muted); box-shadow: inset 0 0 0 1px var(--hair); }
.heath { display: grid; gap: 12px; }
.heath-note { font-size: 13.5px; color: var(--ink); line-height: 1.55; display: grid; gap: 8px; }
.heath-note p { margin: 0; }
.heath-src { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #262b35; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair); }
.btn.ghost:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.checklist { display: grid; gap: 0; }
.checklist > div { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.checklist > div:last-child { border-bottom: 0; }
.checklist span { color: var(--ink-2); }
.checklist b { font-variant-numeric: tabular-nums; font-weight: 600; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; }
.note b { color: var(--ink); }
.empty { display: grid; gap: 8px; place-items: start; padding: 6px 0; }
.empty p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 46ch; }
.select { padding: 5px 8px; border: 1px solid var(--hair); border-radius: 7px; background: var(--surface); font-size: 13px; }
.pick-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.r-badge { font: 500 12px var(--font-mono); color: var(--ink-2); }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); max-width: 80ch; }

@media (max-width: 1100px) {
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 > :nth-child(3):last-child { grid-column: 1 / -1; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-21, .g-12 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--hair); padding: 12px 16px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { width: auto; white-space: nowrap; }
  .rail-foot { display: none; }
  .main { padding-inline: 16px; }
  .g-3, .g-2 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mix-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero-num { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M1.5 8.5h3l1.6-4 3 8 1.9-4.5h3.5" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Health Portal</b><span>David · T1D since 2004</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title"><h1 id="view-title"></h1><p id="view-sub"></p></div>
      <div class="controls" id="controls">
        <div class="seg" id="range-seg" role="group" aria-label="Date range"></div>
        <span class="range-label" id="range-label"></span>
        <label class="toggle"><input type="checkbox" id="cmp" checked> Compare to previous period</label>
      </div>
    </div>
    <div class="period" id="period" hidden></div>
    <div id="view"></div>
    <p class="foot">Trend and coaching context only. Not dosing, diagnosis or treatment advice. Verify against Dexcom, Glooko, Omnipod, WHOOP and your clinical plan before changing anything.</p>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script>

</script>
