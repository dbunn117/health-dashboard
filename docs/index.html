<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Health Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + scoped toolbar; every analytic view re-renders against one date range. Light-only by choice. */
:root {
  color-scheme: light;
  --page: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --ink: #0e1116;
  --ink-2: #4a5160;
  --muted: #8a909c;
  --hair: #e6e8ec;
  --grid: #eef0f3;
  --ring: rgba(14, 17, 22, 0.08);
  --accent: #4b4fd8;
  --accent-wash: #eef0ff;
  /* glucose ranges (validated adjacent, light surface) */
  --g-vlow: #b02a35; --g-low: #ec6a6e; --g-in: #2a78d6; --g-high: #e3a008; --g-vhigh: #b4541a;
  --g-in-wash: rgba(42, 120, 214, 0.08);
  /* status */
  --s-good: #1f9d5a; --s-target: #2a78d6; --s-warn: #e3a008; --s-crit: #d63c3c;
  --s-good-ink: #0f6b3a; --s-warn-ink: #8a5d00; --s-crit-ink: #a52222; --s-target-ink: #1c5cab;
  /* categorical */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-card: 12px;
  --shadow: 0 1px 2px rgba(14, 17, 22, 0.04), 0 0 0 1px var(--ring);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 20px 14px; border-right: 1px solid var(--hair); background: var(--surface-2); display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer; text-align: left; }
.nav button svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; }
.nav button:hover { background: rgba(14, 17, 22, 0.04); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.rail-foot { margin-top: auto; padding: 0 8px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.rail-foot .fresh { display: flex; align-items: center; gap: 6px; }

.main { min-width: 0; padding-inline: 32px; padding-block: 22px 64px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.title h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; background: #eceef2; border-radius: 9px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14,17,22,.08), 0 0 0 1px var(--ring); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }
.range-label { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; padding: 5px 10px; border: 1px solid var(--hair); border-radius: 8px; background: var(--surface); }

/* period banner + "what does this number cover" captions */
.period { display: grid; gap: 4px; margin: -8px 0 18px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.period b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.per-k { display: inline-block; min-width: 104px; font: 500 11px/1 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.kpi-head { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px 2px; font-variant-numeric: tabular-nums; }
.kpi-head b { color: var(--ink); font-weight: 600; }
.when { display: block; font-size: 11.5px; color: var(--muted); }
.when-line { margin: 8px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.when-chip { margin-left: 6px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hair); font: 500 11px var(--font-mono); color: var(--ink-2); white-space: nowrap; }
@media (max-width: 820px) { .per-k { display: block; min-width: 0; margin-bottom: 2px; } }

.grid { display: grid; gap: 16px; }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.stack { display: grid; gap: 16px; }
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
.card-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.card-h .aside { display: flex; align-items: center; gap: 8px; flex: none; }
.scope { font: 500 11px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border: 1px solid var(--hair); border-radius: 5px; }
.ask { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--accent); text-decoration: none; padding: 4px 8px; border-radius: 7px; }
.ask:hover { background: var(--accent-wash); }
.ask svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 1px; background: var(--hair); border-radius: var(--r-card); overflow: hidden; box-shadow: 0 0 0 1px var(--hair); margin-bottom: 16px; }
.kpi { background: var(--surface); padding: 14px 16px; min-width: 0; display: grid; gap: 4px; }
.kpi .lbl { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.kpi .val { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.kpi .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.delta { font-weight: 500; font-variant-numeric: tabular-nums; }
.delta.good { color: var(--s-good-ink); }
.delta.bad { color: var(--s-crit-ink); }
.delta.flat { color: var(--muted); }

/* status chips: icon + label, never color alone */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 7px 2px 6px; border-radius: 999px; white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.good { background: #e7f5ed; color: var(--s-good-ink); } .chip.good i { background: var(--s-good); }
.chip.target { background: #e8f1fc; color: var(--s-target-ink); } .chip.target i { background: var(--s-target); }
.chip.warn { background: #fdf4dc; color: var(--s-warn-ink); } .chip.warn i { background: var(--s-warn); }
.chip.crit { background: #fbe9e9; color: var(--s-crit-ink); } .chip.crit i { background: var(--s-crit); }
.chip.none { background: #f0f1f4; color: var(--ink-2); } .chip.none i { background: var(--muted); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl-t { fill: var(--muted); font: 11px var(--font-mono); font-variant-numeric: tabular-nums; }
.lbl-ink { fill: var(--ink-2); font: 500 11.5px var(--font-ui); }
.lbl-strong { fill: var(--ink); font: 600 12px var(--font-ui); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: #d4d7dd; stroke-width: 1; }
.refline { stroke: var(--ink-2); stroke-width: 1; opacity: .55; }
.cross { stroke: var(--ink-2); stroke-width: 1; opacity: .5; pointer-events: none; }
.hit { fill: transparent; cursor: crosshair; }
.mark { transition: opacity .12s; }
.mark:hover, .mark.hl { opacity: .78; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .ln { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 24px rgba(14,17,22,.18); min-width: 120px; max-width: 260px; }
.tip .t-h { color: #b9bfcc; font: 11px var(--font-mono); margin-bottom: 4px; }
.tip .t-r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .t-r b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .t-r span { color: #c7ccd6; display: inline-flex; align-items: center; gap: 6px; }
.tip .k { width: 10px; height: 2px; border-radius: 2px; display: inline-block; }

/* range mix bar */
.mix { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; }
.mix div { height: 100%; }
.mix-rows { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.mix-rows div { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
.mix-rows b { font-size: 16px; color: var(--ink); font-weight: 600; }
.mix-rows .sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.mix-rows em { font-style: normal; color: var(--muted); font-size: 11.5px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }

/* today */
.hero-num { font-size: 52px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
.hero-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.metric-list { display: grid; gap: 10px; margin-top: 14px; }
.metric-list div { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; font-size: 13px; }
.metric-list span { color: var(--ink-2); }
.metric-list b { font-weight: 600; font-variant-numeric: tabular-nums; }
.metric-list em { font-style: normal; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 14px; }
.dots span { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font: 600 9px var(--font-mono); }
.dots .w { background: #e7f5ed; color: var(--s-good-ink); }
.dots .m { background: #f0f1f4; color: var(--muted); }
.dots .p { background: #fff; color: var(--muted); box-shadow: inset 0 0 0 1px var(--hair); }
.heath { display: grid; gap: 12px; }
.heath-note { font-size: 13.5px; color: var(--ink); line-height: 1.55; display: grid; gap: 8px; }
.heath-note p { margin: 0; }
.heath-src { font-size: 12px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; text-decoration: none; border: 0; cursor: pointer; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.btn.primary { background: var(--ink); color: #fff; }
.btn.primary:hover { background: #262b35; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair); }
.btn.ghost:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.checklist { display: grid; gap: 0; }
.checklist > div { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.checklist > div:last-child { border-bottom: 0; }
.checklist span { color: var(--ink-2); }
.checklist b { font-variant-numeric: tabular-nums; font-weight: 600; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--hair); border-radius: 8px; padding: 10px 12px; }
.note b { color: var(--ink); }
.empty { display: grid; gap: 8px; place-items: start; padding: 6px 0; }
.empty p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 46ch; }
.select { padding: 5px 8px; border: 1px solid var(--hair); border-radius: 7px; background: var(--surface); font-size: 13px; }
.pick-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.r-badge { font: 500 12px var(--font-mono); color: var(--ink-2); }
.foot { margin-top: 28px; font-size: 12px; color: var(--muted); max-width: 80ch; }

@media (max-width: 1100px) {
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 > :nth-child(3):last-child { grid-column: 1 / -1; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-21, .g-12 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--hair); padding: 12px 16px; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { width: auto; white-space: nowrap; }
  .rail-foot { display: none; }
  .main { padding-inline: 16px; }
  .g-3, .g-2 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mix-rows { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero-num { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head><body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M1.5 8.5h3l1.6-4 3 8 1.9-4.5h3.5" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><b>Health Portal</b><span>David · T1D since 2004</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="title"><h1 id="view-title"></h1><p id="view-sub"></p></div>
      <div class="controls" id="controls">
        <div class="seg" id="range-seg" role="group" aria-label="Date range"></div>
        <span class="range-label" id="range-label"></span>
        <label class="toggle"><input type="checkbox" id="cmp" checked> Compare to previous period</label>
      </div>
    </div>
    <div class="period" id="period" hidden></div>
    <div id="view"></div>
    <p class="foot">Trend and coaching context only. Not dosing, diagnosis or treatment advice. Verify against Dexcom, Glooko, Omnipod, WHOOP and your clinical plan before changing anything.</p>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script id="portal-data" type="application/json"></script>
<script>
(async () => {
'use strict';
const embedded = (document.getElementById('portal-data') || {}).textContent || '';
let D;
try { D = embedded.trim().startsWith('{') ? JSON.parse(embedded) : await (await fetch('portal_data.json', { cache: 'no-cache' })).json(); }
catch (e) { document.getElementById('view').textContent = 'Could not load health data. Refresh the page; if it persists, ask Heath to check the portal build.'; return; }
const T = D.targets;
const HEATH_BOT = 'Heath117Bot';

/* ---------- dates ---------- */
const toUTC = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const fromUTC = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => fromUTC(toUTC(s) + n * 864e5);
const diffDays = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const dow = s => new Date(toUTC(s)).getUTCDay();
const fmtD = s => `${MON[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}`;
const fmtDY = s => `${fmtD(s)}, ${s.slice(0, 4)}`;
const fmtMY = s => `${MON[+s.slice(5, 7) - 1]} ${s.slice(2, 4) === '' ? '' : "'" + s.slice(2, 4)}`;
const fmtHM = slot => { const m = slot * 5, h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? 'AM' : 'PM'; return `${(h % 12) || 12}:${String(mm).padStart(2, '0')} ${ap}`; };
const fmtHour = h => h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h - 12}p`;
/* All data is bucketed by Pacific calendar day (12:00 AM – 11:59 PM PT); show times in PT whatever the viewer's clock says. */
const TZN = 'America/Los_Angeles';
const fmtClock = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: TZN, hour: 'numeric', minute: '2-digit' });
const isoPT = dt => dt.toLocaleDateString('en-CA', { timeZone: TZN });
const fmtStamp = iso => `${fmtD(isoPT(new Date(iso)))}, ${fmtClock(iso)} PT`;
function fmtSpan(a, b, year = true) {
  if (a === b) return year ? fmtDY(a) : fmtD(a);
  const y = year ? `, ${b.slice(0, 4)}` : '';
  if (a.slice(0, 4) !== b.slice(0, 4)) return `${fmtDY(a)} – ${fmtDY(b)}`;
  if (a.slice(0, 7) === b.slice(0, 7)) return `${fmtD(a)} – ${+b.slice(8)}${y}`;
  return `${fmtD(a)} – ${fmtD(b)}${y}`;
}
const nDays = (a, b) => diffDays(a, b) + 1;
const plural = (n, w, ws = w + 's') => `${n.toLocaleString()} ${n === 1 ? w : ws}`;

/* ---------- data ---------- */
const DAYS = D.days.map(r => ({ date: r[0], n: r[1], avg: r[2], sd: r[3], ins: r[9], basal: r[10], bolus: r[11], carbs: r[12] }));
const DAY = new Map(DAYS.map(d => [d.date, d]));
const lastDate = DAYS[DAYS.length - 1].date;
const lastFull = [...DAYS].reverse().find(d => d.n >= 250).date;
const firstDate = DAYS[0].date;

const cgmCache = new Map();
function cgm(date) {
  if (cgmCache.has(date)) return cgmCache.get(date);
  const b = D.cgm[date];
  let a = null;
  if (b) { const s = atob(b); a = new Uint16Array(288); for (let i = 0; i < 288; i++) a[i] = s.charCodeAt(2 * i) | (s.charCodeAt(2 * i + 1) << 8); }
  cgmCache.set(date, a);
  return a;
}
function bucketCounts(vals, acc) {
  for (const v of vals) {
    if (!v) continue;
    acc.n++; acc.sum += v; acc.sum2 += v * v;
    if (v < 54) acc.vlow++; else if (v < 70) acc.low++; else if (v <= 180) acc.inr++; else if (v <= 250) acc.high++; else acc.vhigh++;
  }
  return acc;

function groupDays(ds, maxDaily) {

  return [...groups].map(([k, arr]) => ({
    label: monthly ? `${MON[+k.slice(5) - 1]} '${k.slice(2, 4)}` : fmtD(k),
    head: (monthly || weekly) ? `${fmtSpan(arr[0], arr[arr.length - 1])} (daily avg of ${arr.length} days)` : `${WDL[dow(k)]}, ${fmtDY(k)}`,
    mean: key => { const v = arr.map(d => DAY.get(d) && DAY.get(d)[key]).filter(x => x != null && x > 0); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; },

function deltaElAlways(cur, prev, better, unit = '', digits = 1, label = 'vs prior scan') {

  const d = cur - prev, r = Math.abs(d) < Math.pow(10, -digits) / 2 ? 0 : d;
  const cls = r === 0 || !better ? 'flat' : ((r > 0) === (better === 'up') ? 'good' : 'bad');
  return h('span', { class: 'delta ' + cls }, `${r > 0 ? '+' : r < 0 ? '−' : '±'}${Math.abs(r).toFixed(digits)}${unit}${label ? ' ' + label : ''}`);
}
function liftTable(start, end) {
  return Object.entries(LADDER.lifts || {}).map(([name, arr]) => {
    const r = arr.filter(x => x[1] && x[0] >= start && x[0] <= end);
    if (r.length < 2) return null;
    return { name, n: r.length, first: r[0][1], latest: r[r.length - 1][1], best: Math.max(...r.map(x => x[1])), lastDate: r[r.length - 1][0] };

}

  tir: { name: 'Time in range (%)', get: d => { const s = dayStats(d); return s && s.n >= 200 ? s.tir : null; }, fmt: v => f0(v) + '%' },
  low: { name: 'Below 70 (%)', get: d => { const s = dayStats(d); return s && s.n >= 200 ? s.lowAll : null; }, fmt: f1 },
  avg: { name: 'Average glucose', get: d => { const s = dayStats(d); return s && s.n >= 200 ? s.mean : null; }, fmt: f0 },
  sd: { name: 'Glucose SD', get: d => { const s = dayStats(d); return s && s.n >= 200 ? s.sd : null; }, fmt: f0 },
  ins: { name: 'Total insulin (U)', get: d => DAY.get(d) && DAY.get(d).ins || null, fmt: f1 },
  carbs: { name: 'Carbs in pump (g)', get: d => DAY.get(d) && DAY.get(d).carbs || null, fmt: f0 },
  rec: { name: 'WHOOP recovery (that morning)', get: d => REC.get(d) ? REC.get(d).rec : null, fmt: f0 },
  hrv: { name: 'HRV (ms)', get: d => REC.get(d) ? REC.get(d).hrv : null, fmt: f1 },
  sleep: { name: 'Hours asleep (night before)', get: d => SLP.get(d) ? SLP.get(d).hrs : null, fmt: f1 },
  strain: { name: 'WHOOP strain (sum)', get: d => { const w = WORK.filter(x => x.d === d); return w.length ? w.reduce((a, b) => a + (b.strain || 0), 0) : null; }, fmt: f1 },
};
const explore = { x: 'sleep', y: 'tir', heat: 'in', lift: null };
function viewPatterns(root) {
  const R = curRange(), ds = datesIn(R.start, R.end);
  // heatmap
  const heatHost = h('div', { class: 'chart' });
  const HEAT = { in: { name: 'In range', color: [42, 120, 214], fn: v => v >= 70 && v <= 180 }, low: { name: 'Below 70', color: [176, 42, 53], fn: v => v < 70 }, high: { name: 'Above 180', color: [180, 84, 26], fn: v => v > 180 } };
  const heatSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Heatmap metric' }, ...Object.entries(HEAT).map(([k, v]) => h('button', { 'aria-pressed': String(explore.heat === k), onclick: () => { explore.heat = k; render(); } }, v.name)));
  root.append(card('Week rhythm', `Share of readings ${HEAT[explore.heat].name.toLowerCase()} by weekday and hour · ${fmtD(R.start)} – ${fmtD(R.end)}`, heatSeg, heatHost));
  // compare table
  const cur = rangeStats(R.start, R.end), prev = R.prev ? rangeStats(R.prev.start, R.prev.end) : null;
  const lyS = addDays(R.start, -364), lyE = addDays(R.end, -364), ly = lyS >= firstDate ? rangeStats(lyS, lyE) : null;
  const rowsDef = [['Time in range', 'tir', '%', 1, 'up', `>${T.tir.target}%`], ['Below 70', 'lowAll', '%', 1, 'down', `<${T.lowMax}%`], ['Below 54', 'vlow', '%', 2, 'down', `<${T.veryLowMax}%`], ['Above 180', 'highAll', '%', 1, 'down', ''], ['Average glucose', 'mean', '', 0, 'down', ''], ['SD', 'sd', '', 0, 'down', `<${T.sdMax}`], ['CV', 'cv', '%', 1, 'down', '<36%'], ['GMI', 'gmi', '%', 1, 'down', `A1c <${T.a1cMax}%`], ['Insulin per day', 'ins', ' U', 1, null, ''], ['Carbs per day', 'carbs', ' g', 0, null, '']];
  const fmtv = (v, u, dg) => v == null ? '—' : (dg === 0 ? f0(v) : dg === 2 ? f2(v) : f1(v)) + u;
  const cmpTable = h('table', null, h('thead', null, h('tr', null, h('th', null, 'Metric'), h('th', { class: 'num' }, fmtSpan(R.start, R.end)), h('th', { class: 'num' }, R.prev ? `Previous: ${fmtSpan(R.prev.start, R.prev.end)}` : 'Previous'), h('th', { class: 'num' }, 'Change'), h('th', { class: 'num' }, ly ? `Year earlier: ${fmtSpan(lyS, lyE)}` : 'Year earlier'), h('th', null, 'Goal'))),
    h('tbody', null, ...rowsDef.map(([l, k, u, dg, b, goal]) => h('tr', null, h('td', null, l), h('td', { class: 'num' }, h('b', null, fmtv(cur && cur[k], u, dg))), h('td', { class: 'num' }, fmtv(prev && prev[k], u, dg)), h('td', { class: 'num' }, prev ? deltaElAlways(cur[k], prev[k], b, u.trim() === '%' ? ' pts' : u, dg, '') : '—'), h('td', { class: 'num' }, fmtv(ly && ly[k], u, dg)), h('td', null, goal)))));
  root.append(h('div', { style: 'margin-top:16px' }, card('Compare periods', `${fmtSpan(R.start, R.end)} against the ${R.len} days just before it and the same weekdays 52 weeks earlier`, askLink(`Compare ${fmtD(R.start)}–${fmtD(R.end)} with the period before: TIR ${f1(cur && cur.tir)}% vs ${f1(prev && prev.tir)}%. What changed?`), h('div', { class: 'tbl-wrap' }, cmpTable))));
  // explorer
  const scHost = h('div', { class: 'chart' });
  const sel = (key, id) => h('select', { class: 'select', id, onchange: e => { explore[key] = e.target.value; render(); } }, ...Object.entries(METRICS).map(([k, m]) => h('option', { value: k, selected: explore[key] === k }, m.name)));
  const pts = ds.map(d => { const x = METRICS[explore.x].get(d), y = METRICS[explore.y].get(d); return x != null && y != null ? [x, y, d] : null; }).filter(Boolean);
  const r = pearson(pts);
  root.append(h('div', { style: 'margin-top:16px' }, card('Explore relationships', `${fmtSpan(R.start, R.end)} · pick any two daily metrics. Each dot is one complete day (midnight to midnight PT).`, askLink(`Is there a real relationship between ${METRICS[explore.x].name} and ${METRICS[explore.y].name} for me? I see r = ${r == null ? 'n/a' : r.toFixed(2)} over ${pts.length} days.`),
    h('div', { class: 'pick-row' }, 'Compare', sel('x', 'exp-x'), 'against', sel('y', 'exp-y'), h('span', { class: 'r-badge' }, r == null ? 'Not enough overlapping days' : `r = ${r.toFixed(2)} · ${pts.length} days`)),
    h('div', { style: 'margin-top:12px' }, scHost),
    h('p', { class: 'heath-src' }, 'Correlation shows things that move together. It does not show cause; use it to pick experiments.'))));
  requestAnimationFrame(() => {
    const H = HEAT[explore.heat];
    const cnt = Array.from({ length: 7 }, () => Array.from({ length: 24 }, () => [0, 0]));
    for (const d of ds) { const a = cgm(d); if (!a) continue; const w = (dow(d) + 6) % 7; for (let i = 0; i < 288; i++) if (a[i]) { const c = cnt[w][Math.floor(i / 12)]; c[1]++; if (H.fn(a[i])) c[0]++; } }
    const vals = cnt.map(r => r.map(([a, n]) => n ? a / n : null));
    const maxV = Math.max(0.01, ...vals.flat().filter(v => v != null));
    const [cr, cg, cb] = H.color;
    const mix = t => { const k = 0.08 + 0.92 * t; return `rgb(${Math.round(255 + (cr - 255) * k)},${Math.round(255 + (cg - 255) * k)},${Math.round(255 + (cb - 255) * k)})`; };
    heatmap(heatHost, { rows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cols: Array.from({ length: 24 }, (_, i) => fmtHour(i)), values: vals, color: v => mix(explore.heat === 'in' ? v : v / maxV), tip: (r, c) => [{ label: H.name, value: vals[r][c] == null ? 'No data' : f1(100 * vals[r][c]) + '%' }, { label: 'Readings', value: String(cnt[r][c][1]) }] });
    scatter(scHost, { pts, xName: METRICS[explore.x].name, yName: METRICS[explore.y].name, xFmt: METRICS[explore.x].fmt, yFmt: METRICS[explore.y].fmt, height: 300 });
  });
}

const LABS = [
  ['HbA1c', '7.3%', 'ref <5.7%', 'crit', 'Up from 6.5% (Oct 2025)'],
  ['Ferritin', '19 ng/mL', 'ref 38–380', 'crit', 'Depleted iron stores; recheck due ~late Nov'],
  ['Omega-3 index', '2.3%', 'min >5.4%', 'crit', 'Significantly low'],
  ['Lipoprotein(a)', '101 nmol/L', 'ref <75', 'warn', 'Genetic cardiovascular risk factor'],
  ['LDL particle number', '1227 nmol/L', 'high', 'warn', 'Small/medium LDL also elevated'],
  ['Free testosterone', '60.1 pg/mL', 'optimal 148.8–228.1', 'warn', 'SHBG 47 (high-normal)'],
  ['Creatinine', '1.27 mg/dL', 'ref 0.60–1.26', 'warn', 'Mild; may reflect muscle mass'],
  ['TSH', '2.39 mIU/L', 'ref 0.4–4.5', 'none', 'In range, slightly above optimal'],
  ['hs-CRP', '0.3 mg/L', 'optimal', 'good', 'Low inflammation'],
];
function viewLabs(root) {
  const a1c = D.a1c || [];
  const latest = a1c[a1c.length - 1];
  const host = h('div', { class: 'chart' });
  root.append(h('div', { class: 'grid g-21' },
    card('A1c and GMI', `Lab A1c by draw date against GMI from CGM. Each GMI point = the 90 days ending on the 28th of that month (latest point ends ${fmtD(lastFull)}).`, askLink(`My A1c went from 6.5% to ${latest.value}%. What are the biggest levers to get back under ${T.a1cMax}%?`), host,
      h('div', { class: 'legend' }, h('span', null, h('i', { class: 'ln', style: 'background:var(--c1)' }), 'GMI from CGM'), h('span', null, h('i', { class: 'sw', style: 'background:var(--c2);border-radius:50%' }), 'Lab A1c'), h('span', null, h('i', { class: 'ln', style: 'background:var(--ink-2);opacity:.55' }), `Goal <${T.a1cMax}%`))),
    card('Coming up', 'From your vault notes, as of Oct 1, 2026 (typed in by hand, not updated automatically)', null, h('div', { class: 'checklist' },
      h('div', null, h('span', null, 'A1c with Sutter'), h('b', null, 'Overdue'), chip('crit', 'Since Apr 24')),
      h('div', null, h('span', null, 'Eye exam'), h('b', null, 'Due'), chip('warn', 'Since Aug 1')),
      h('div', null, h('span', null, 'Ferritin recheck'), h('b', null, '~Late Nov'), chip('none', 'Planned')),
      h('div', null, h('span', null, 'Omega-3 recheck'), h('b', null, 'Nov–Feb'), chip('none', 'Planned')),
      h('div', null, h('span', null, 'Next DEXA'), h('b', null, 'Not booked'), chip('none', 'Every 3–4 months'))))));
  root.append(h('div', { style: 'margin-top:16px' }, card('Flagged lab results', 'Function Health via Quest, drawn Aug 2026 · A1c history from Sutter', askLink('Which of my flagged labs matter most right now and what should I ask my doctor?'),
    h('div', { class: 'tbl-wrap' }, h('table', null, h('thead', null, h('tr', null, h('th', null, 'Test'), h('th', { class: 'num' }, 'Result'), h('th', null, 'Reference'), h('th', null, 'Status'), h('th', null, 'Note'))),
      h('tbody', null, ...LABS.map(([t, v, r, c, n]) => h('tr', null, h('td', null, t), h('td', { class: 'num' }, h('b', null, v)), h('td', null, r), h('td', null, chip(c, { crit: 'Flagged', warn: 'Watch', none: 'In range', good: 'Good' }[c])), h('td', null, n)))))))));
  requestAnimationFrame(() => {
    const months = []; for (let m = firstDate.slice(0, 7); m <= lastFull.slice(0, 7);) { months.push(m); const y = +m.slice(0, 4), mo = +m.slice(5); m = mo === 12 ? `${y + 1}-01` : `${y}-${String(mo + 1).padStart(2, '0')}`; }
    const t0 = toUTC(a1c.find(x => x.date >= '2023-01-01').date), t1 = toUTC(lastFull);
    const pts = [];
    months.forEach(m => { const end = m + '-28' > lastFull ? lastFull : m + '-28'; const s = rangeStats(addDays(end, -89) < firstDate ? firstDate : addDays(end, -89), end); if (s && diffDays(firstDate, end) >= 60) pts.push({ t: toUTC(end), v: s.gmi, label: `${MON[+m.slice(5) - 1]} ${m.slice(0, 4)}` }); });
    const labs = a1c.filter(x => toUTC(x.date) >= t0);
    const allT = [...pts.map(p => p.t), ...labs.map(x => toUTC(x.date))].sort((a, b) => a - b);
    const tmin = Math.min(t0, ...allT), tmax = Math.max(t1, ...allT);
    const fr = frame(host, 250);
    const y = lin(5.5, 8.5, fr.y0, fr.y1), x = t => fr.x0 + (t - tmin) / (tmax - tmin) * (fr.x1 - fr.x0);
    yAxis(fr, y, [6, 6.5, 7, 7.5, 8, 8.5], v => v + '%');
    s('line', { x1: fr.x0, x2: fr.x1, y1: y(T.a1cMax), y2: y(T.a1cMax), class: 'refline' }, fr.svg);
    s('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ',' + y(p.v).toFixed(1)).join(''), fill: 'none', stroke: 'var(--c1)', 'stroke-width': 2, 'stroke-linejoin': 'round' }, fr.svg);
    labs.forEach(l => { const c = s('circle', { cx: x(toUTC(l.date)), cy: y(l.value), r: 5, fill: 'var(--c2)', stroke: 'var(--surface)', 'stroke-width': 2, class: 'mark' }, fr.svg); const hit = s('circle', { cx: x(toUTC(l.date)), cy: y(l.value), r: 12, fill: 'transparent' }, fr.svg); hit.addEventListener('pointermove', e => showTip(e, fmtDY(l.date), [{ label: 'Lab A1c', value: l.value + '%', color: 'var(--c2)' }, { label: 'Source', value: l.source }])); hit.addEventListener('pointerleave', hideTip); const tx = s('text', { x: x(toUTC(l.date)), y: y(l.value) - 10, 'text-anchor': 'middle', class: 'lbl-strong' }, fr.svg); tx.textContent = l.value + '%'; });
    s('line', { x1: fr.x0, x2: fr.x1, y1: fr.y0, y2: fr.y0, class: 'baseline' }, fr.svg);
    const g = s('g', { class: 'axis' }, fr.svg);
    for (let yr = new Date(tmin).getUTCFullYear() + 1; yr <= new Date(tmax).getUTCFullYear(); yr++) { const tx = s('text', { x: x(Date.UTC(yr, 0, 1)), y: fr.y0 + 17, 'text-anchor': 'middle' }, g); tx.textContent = String(yr); }
    const cross = s('line', { y1: fr.y1, y2: fr.y0, class: 'cross', visibility: 'hidden' }, fr.svg);
    const hit = s('rect', { x: fr.x0, y: fr.y1, width: fr.x1 - fr.x0, height: fr.y0 - fr.y1, class: 'hit' }, fr.svg);
    fr.svg.insertBefore(hit, fr.svg.querySelector('circle'));
    hit.addEventListener('pointermove', evt => { const r = fr.svg.getBoundingClientRect(); const px = (evt.clientX - r.left) * fr.w / r.width; let b = pts[0], bd = Infinity; pts.forEach(p => { const d = Math.abs(x(p.t) - px); if (d < bd) { bd = d; b = p; } }); cross.setAttribute('x1', x(b.t)); cross.setAttribute('x2', x(b.t)); cross.setAttribute('visibility', 'visible'); showTip(evt, `90 days ending ${fmtDY(fromUTC(b.t))}`, [{ label: 'GMI', value: f1(b.v) + '%', color: 'var(--c1)' }]); });
    hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
  });
}

/* ---------- shell ---------- */
const nav = document.getElementById('nav'), viewEl = document.getElementById('view');
function renderNav() {
  nav.replaceChildren(...VIEWS.map(v => h('button', { 'aria-current': state.view === v.id ? 'page' : null, onclick: () => { state.view = v.id; history.replaceState(null, '', '#' + v.id); render(); window.scrollTo(0, 0); } }, icon(v.icon), v.name)));
  document.getElementById('rail-foot').replaceChildren(
    h('div', { class: 'fresh' }, chip('good', 'Live'), 'Refreshes daily ~8:25 AM PT'),
    h('div', null, `Built ${D.generated_at ? fmtStamp(D.generated_at) : '—'}`),
    h('div', null, `Glucose through ${D.glucose_through ? fmtStamp(D.glucose_through) : '—'}`),
    h('div', null, `WHOOP through the morning of ${D.whoop_through ? fmtD(D.whoop_through) : '—'}`),
    h('div', null, `CGM history since ${fmtDY(firstDate)}`));
}
function renderControls(v) {

  seg.replaceChildren(...RANGES.map(([k]) => h('button', { 'aria-pressed': String(state.range === k), onclick: () => { state.range = k; try { localStorage.setItem('hp-range', k); } catch (e) {} render(); } }, k)));
  const R = rangeFor(v);
  document.getElementById('range-label').textContent = `${fmtSpan(R.start, R.end)} · ${plural(R.len, 'day')}`;
  document.getElementById('controls').hidden = !v.ranged;
  const per = document.getElementById('period');
  per.hidden = !v.ranged;
  if (!v.ranged) return;
  const endWhy = v.id === 'sleep'
    ? `Ends with the latest WHOOP morning (${fmtD(R.end)}). Each recovery and night of sleep is dated by the morning you woke up, so ${fmtD(R.end)} means the night of ${fmtD(addDays(R.end, -1))} → ${fmtD(R.end)}.`
    : `Each day runs 12:00 AM – 11:59 PM Pacific. Ends with the last complete day of CGM data (${fmtD(R.end)}); ${lastDate > R.end ? `${fmtD(lastDate)} is left out until it's complete.` : 'nothing newer has synced yet.'}`;
  per.replaceChildren(
    h('div', null, h('span', { class: 'per-k' }, 'Showing'), h('b', null, fmtSpan(R.start, R.end)), ` · ${plural(R.len, 'day')}. `, endWhy),
    state.compare ? h('div', null, h('span', { class: 'per-k' }, 'Compared with'), R.prev ? [h('b', null, fmtSpan(R.prev.start, R.prev.end)), `, the ${plural(R.len, 'day')} just before.`] : 'No earlier data of the same length to compare with.') : null);
}
const SUBS = {
  today: () => `${WDL[dow(isoPT(new Date()))]}, ${fmtDY(isoPT(new Date()))} · data through ${D.glucose_through ? fmtStamp(D.glucose_through) : '—'}`,
  glucose: () => 'Control against your tiers, daily pattern and lows',
  training: () => 'Body composition, training volume and how training affects glucose',
  sleep: () => 'WHOOP recovery and sleep against your targets',
  patterns: () => 'Find what drives your numbers',
  labs: () => 'Lab history and what is due',
};
function render() {
  const v = VIEWS.find(x => x.id === state.view) || VIEWS[0];

  document.getElementById('view-title').textContent = v.id === 'today' ? 'Good morning, David' : v.name;

  document.getElementById('cmp').checked = state.compare;
  hideTip();

}
document.getElementById('cmp').addEventListener('change', e => { state.compare = e.target.checked; render(); });
const hv = (location.hash || '').slice(1);
if (VIEWS.some(v => v.id === hv)) state.view = hv;
addEventListener('hashchange', () => { const k = location.hash.slice(1); if (VIEWS.some(v => v.id === k) && k !== state.view) { state.view = k; render(); } });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });

})();
